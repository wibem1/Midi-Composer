<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini 3.7 Flash – MIDI Lab v4</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui,-apple-system,sans-serif; max-width:1000px; margin:28px auto; padding:0 18px; line-height:1.4; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { opacity:.76; margin-top:0; }
  label { display:block; font-weight:650; margin:16px 0 6px; }
  input,textarea,button { font:inherit; }
  input,textarea { width:100%; box-sizing:border-box; padding:10px; border:1px solid #8888; border-radius:8px; }
  textarea { min-height:110px; resize:vertical; }
  #raw { min-height:360px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  button { padding:10px 15px; border-radius:8px; border:1px solid #8888; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { margin-top:12px; white-space:pre-wrap; padding:10px; border-radius:8px; background:#8881; }
  details { margin-top:16px; }
  pre { white-space:pre-wrap; font-size:12px; padding:10px; border-radius:8px; background:#8881; overflow:auto; }
</style>
</head>
<body>
<h1>Gemini 3.7 Flash – MIDI Lab v4</h1>
<p class="sub">Freie Besetzung und musikalischer Ausdruck: Der Benutzerauftrag bestimmt die Komposition. Gemini kann Velocity und – wo musikalisch sinnvoll – Sustain-Pedal mitkomponieren. Das HTML übersetzt nur die fertige Notenschrift in MIDI.</p>

<label for="key">Gemini API-Key</label>
<input id="key" type="password" autocomplete="off" placeholder="AIza…">

<label for="prompt">Kompositionsauftrag</label>
<textarea id="prompt">Komponiere ein 24-taktiges Stück für Klavier solo.</textarea>

<div class="row">
  <button id="compose">Mit Gemini 3.7 Flash komponieren</button>
  <button id="midi" disabled>MIDI herunterladen</button>
  <button id="fromRaw">Rohantwort → MIDI</button>
  <button id="rawDownload" disabled>Rohantwort herunterladen</button>
</div>

<div id="status">Bereit.</div>

<label for="raw">Rohe Modellantwort</label>
<textarea id="raw" spellcheck="false" placeholder="Hier erscheint die unveränderte Antwort von Gemini."></textarea>

<details>
  <summary>Technischer Ausgabeauftrag</summary>
  <pre id="contract"></pre>
</details>

<script>
'use strict';

const MODEL = 'gemini-3.7-flash';
const PPQ = 480;
let currentMidi = null;
let currentTitle = 'composition';

const technicalContract = `
TECHNISCHE AUSGABEANFORDERUNG – keine musikalischen Zusatzregeln:

Erfülle den Benutzerauftrag musikalisch genau so, wie er gestellt wurde. Insbesondere:
- Verwende genau die gewünschte Besetzung. Ersetze oder ergänze keine Instrumente eigenmächtig.
- Halte eine verlangte Taktzahl exakt ein.
- Halte ausdrücklich verlangte Stil-, Taktart-, Tempo-, Tonart- oder Formangaben ein.
- Was der Benutzer NICHT festgelegt hat, entscheidest du musikalisch selbst.

Gib die fertige Komposition ausschließlich in dieser einfachen Notenschrift aus:

TITLE: frei gewählter Titel
BARS: Zahl der Takte der Komposition
TEMPO: ganze Zahl in BPM
METER: Zaehler/Nenner, z.B. 4/4, 3/4 oder 3/2
KEY: freie Textangabe

Danach folgen genau die Instrumente/Stimmen, die der Benutzer verlangt hat. Jede Spur hat einen frei lesbaren Namen und eine General-MIDI-Programmnummer (0 bis 127):

[Piano|GM=0]
1 | D4:1 F4:1 A4:2
2 | [D3,A3]:2 [F3,C4]:2
...

oder bei einem Ensemble zum Beispiel:

[Flute|GM=73]
1 | D5:1 E5:1 F5:1 G5:1
...
[Violin|GM=40]
1 | ...
...

Regeln des DATEIFORMATS, nicht der Komposition:
- Die Zahl der Spurabschnitte ist frei und folgt ausschließlich der vom Benutzer gewünschten Besetzung.
- Bei Solo-Instrument ist genau eine Instrumentenspur auszugeben.
- Spurkopf exakt: [Name|GM=n], wobei n eine General-MIDI-Programmnummer von 0 bis 127 ist.
- Jede Spur enthaelt jeden Takt von 1 bis BARS genau einmal.
- Ein Token ist TONHOEHE:DAUER oder R:DAUER fuer Pause.
- Akkorde stehen in eckigen Klammern: [D3,A3,D4]:2
- Tonhoehen: C, C#, Db, D ... mit Oktavzahl, z.B. F#4 oder Bb3.
- DAUER wird in Viertelnoten-Schlaegen angegeben: 4 = vier Viertel, 2 = zwei Viertel, 1 = ein Viertel, 0.5 = Achtel, 0.25 = Sechzehntel. Dezimalwerte sind erlaubt.
- Gestalte den musikalischen Ausdruck durch sinnvoll differenzierte Anschlagstaerken (Velocity). Schreibe sie als @Wert hinter die Dauer, z.B. D5:1@78 oder [D3,A3,D4]:2@70. Bereich 1–127. Vermeide eine durchgehend identische Velocity, sofern das musikalisch nicht bewusst beabsichtigt ist.
- Wo ein Sustain-Pedal zum verlangten Instrument und zur Musik passt (insbesondere Klavier), darfst und sollst du es musikalisch sinnvoll einsetzen. Verwende dafuer die eigenstaendigen Tokens PEDAL_ON und PEDAL_OFF an der jeweiligen zeitlichen Position im Takt. Diese Tokens haben keine Dauer.
- Beispiel: 1 | PEDAL_ON A2:1@58 [E3,A3,C4]:2@68 PEDAL_OFF E4:1@74
- Bei Instrumenten, fuer die ein Sustain-Pedal musikalisch keinen Sinn ergibt, verwende keine PEDAL-Tokens.
- Die Summe der Dauern jedes Taktes muss zur gewaehlten Taktart passen. Bei 4/4 also 4 Viertelschlaege, bei 3/4 also 3, bei 3/2 also 6.
- Keine Markdown-Codezaeune und kein erklaerender Text vor oder nach der Notenschrift.
`;

document.getElementById('contract').textContent = technicalContract.trim();
const $ = id => document.getElementById(id);
const status = msg => $('status').textContent = msg;

$('compose').addEventListener('click', compose);
$('fromRaw').addEventListener('click', () => {
  try {
    const text = $('raw').value.trim();
    if (!text) throw new Error('Keine Rohantwort vorhanden.');
    const score = parseScore(text);
    currentTitle = score.title || 'composition';
    currentMidi = buildMidi(score);
    $('midi').disabled = false;
    $('rawDownload').disabled = false;
    status('Rohantwort erfolgreich in MIDI umgewandelt.\n' + validateScore(score).join('\n'));
  } catch (err) {
    console.error(err);
    status('Fehler beim Umwandeln der Rohantwort: ' + err.message);
  }
});
$('midi').addEventListener('click', () => {
  if (!currentMidi) return;
  downloadBlob(new Blob([currentMidi], {type:'audio/midi'}), safeName(currentTitle) + '.mid');
});
$('rawDownload').addEventListener('click', () => {
  downloadBlob(new Blob([$('raw').value], {type:'text/plain;charset=utf-8'}), safeName(currentTitle) + '_raw.txt');
});

async function compose() {
  const apiKey = $('key').value.trim();
  const userPrompt = $('prompt').value.trim();
  if (!apiKey) { status('Bitte API-Key eingeben.'); return; }
  if (!userPrompt) { status('Bitte Kompositionsauftrag eingeben.'); return; }

  $('compose').disabled = true;
  $('midi').disabled = true;
  $('rawDownload').disabled = true;
  currentMidi = null;
  status('Gemini komponiert …');

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
    const body = {
      contents: [{ role:'user', parts:[{text:userPrompt},{text:technicalContract}] }],
      generationConfig: { maxOutputTokens:32768, thinkingConfig:{thinkingLevel:'medium'} }
    };
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},
      body:JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
    const text = (data.candidates || []).flatMap(c => c.content?.parts || []).map(p => p.text || '').join('').trim();
    if (!text) throw new Error('Gemini lieferte keinen Text.');
    $('raw').value = text;
    $('rawDownload').disabled = false;

    const score = parseScore(text);
    currentTitle = score.title || 'composition';
    currentMidi = buildMidi(score);
    $('midi').disabled = false;
    status('Komposition empfangen und MIDI erzeugt.\n' + validateScore(score).join('\n'));
  } catch (err) {
    console.error(err);
    status('Fehler: ' + err.message + '\n\nDie Rohantwort bleibt sichtbar, falls bereits eine angekommen ist.');
  } finally {
    $('compose').disabled = false;
  }
}

function parseScore(raw) {
  const text = raw.replace(/^```[^\n]*\n?/i,'').replace(/```\s*$/,'').trim();
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const score = { title:'Composition', bars:null, tempo:90, meterNum:4, meterDen:4, key:'', tracks:[] };
  let track = null;

  for (const line of lines) {
    let m;
    if ((m = line.match(/^TITLE\s*:\s*(.+)$/i))) { score.title = m[1].trim(); continue; }
    if ((m = line.match(/^BARS\s*:\s*(\d+)$/i))) { score.bars = clamp(+m[1],1,1000); continue; }
    if ((m = line.match(/^TEMPO\s*:\s*(\d+)/i))) { score.tempo = clamp(+m[1],20,300); continue; }
    if ((m = line.match(/^METER\s*:\s*(\d+)\s*\/\s*(\d+)/i))) { score.meterNum=+m[1]; score.meterDen=+m[2]; continue; }
    if ((m = line.match(/^KEY\s*:\s*(.+)$/i))) { score.key=m[1].trim(); continue; }
    if ((m = line.match(/^\[(.+?)\s*\|\s*GM\s*=\s*(\d{1,3})\]$/i))) {
      const name = m[1].trim();
      const program = +m[2];
      if (program < 0 || program > 127) throw new Error(`Ungueltige GM-Programmnummer fuer ${name}: ${program}`);
      track = {name, program, bars:[]};
      score.tracks.push(track);
      continue;
    }
    if (track && (m = line.match(/^(\d+)\s*\|\s*(.*)$/))) {
      track.bars.push({bar:+m[1], tokens:tokenizeBar(m[2].trim())});
    }
  }

  if (!score.tracks.length) throw new Error('Keine Instrumentenspuren gefunden. Erwartet wird z.B. [Piano|GM=0].');
  for (const t of score.tracks) t.bars.sort((a,b)=>a.bar-b.bar);
  if (!score.bars) score.bars = Math.max(...score.tracks.flatMap(t => t.bars.map(b => b.bar)),0);
  if (!score.bars) throw new Error('Keine Takte gefunden.');
  return score;
}

function tokenizeBar(s) {
  if (!s) return [];
  const tokens = s.match(/\[[^\]]+\]:[^\s]+|[^\s]+/g) || [];
  return tokens.map(parseToken);
}

function parseToken(tok) {
  if (/^PEDAL_ON$/i.test(tok)) return {type:'pedal', value:127, dur:0};
  if (/^PEDAL_OFF$/i.test(tok)) return {type:'pedal', value:0, dur:0};
  const m = tok.match(/^(R|\[[^\]]+\]|[A-Ga-g][#b]?-?\d+)\s*:\s*([0-9.]+)(?:@([0-9]+))?$/);
  if (!m) throw new Error(`Unverstaendliches Notentoken: ${tok}`);
  const pitchPart=m[1], dur=+m[2], vel=m[3]?clamp(+m[3],1,127):null;
  if (!(dur>0)) throw new Error(`Ungueltige Dauer: ${tok}`);
  if (pitchPart==='R') return {type:'note',rest:true,dur,vel};
  const pitches=pitchPart.startsWith('[') ? pitchPart.slice(1,-1).split(',').map(x=>x.trim()).filter(Boolean) : [pitchPart];
  return {type:'note',rest:false,pitches,dur,vel};
}

function validateScore(score) {
  if (![1,2,4,8,16].includes(score.meterDen)) throw new Error(`Nicht unterstuetzter Taktnenner: ${score.meterDen}`);
  const beatsPerBar=score.meterNum*(4/score.meterDen);
  const report=[`Titel: ${score.title}`,`Takte: ${score.bars}`,`Tempo: ${score.tempo} BPM`,`Taktart: ${score.meterNum}/${score.meterDen}`,`Tonart/Modus: ${score.key||'nicht angegeben'}`,`Spuren: ${score.tracks.length}`];
  for (const t of score.tracks) {
    const nums=new Set(t.bars.map(b=>b.bar));
    const missing=[], duplicate=[];
    const counts={};
    for (const b of t.bars) counts[b.bar]=(counts[b.bar]||0)+1;
    for (let i=1;i<=score.bars;i++) { if(!nums.has(i)) missing.push(i); if((counts[i]||0)>1) duplicate.push(i); }
    const problems=[];
    for (const b of t.bars) {
      const sum=b.tokens.reduce((a,x)=>a+(x.type==='pedal'?0:x.dur),0);
      if (Math.abs(sum-beatsPerBar)>0.0001) problems.push(`T${b.bar}=${trimNum(sum)}`);
    }
    const velocities=t.bars.flatMap(b=>b.tokens).filter(x=>x.type!=='pedal' && !x.rest && x.vel!=null).map(x=>x.vel);
    const pedalEvents=t.bars.flatMap(b=>b.tokens).filter(x=>x.type==='pedal').length;
    let line=`${t.name} (GM ${t.program}): ${t.bars.length} Takte`;
    if(velocities.length) line+=`; Velocity ${Math.min(...velocities)}–${Math.max(...velocities)} (${new Set(velocities).size} Werte)`;
    else line+=`; keine explizite Velocity`;
    if(pedalEvents) line+=`; ${pedalEvents} Pedal-Ereignisse`;
    if(missing.length) line+=`; fehlen: ${missing.join(',')}`;
    if(duplicate.length) line+=`; doppelt: ${duplicate.join(',')}`;
    if(problems.length) line+=`; abweichende Taktlaengen: ${problems.join(', ')}`;
    let pedalOn=false, pedalBalanceProblem=false;
    for(const b of t.bars) for(const x of b.tokens) if(x.type==='pedal') {
      if(x.value>=64) pedalOn=true; else pedalOn=false;
    }
    if(pedalOn) { line+=`; WARNUNG: Pedal am Ende noch ON`; pedalBalanceProblem=true; }
    report.push(line);
  }
  return report;
}

function buildMidi(score) {
  validateScore(score);
  const chunks=[];
  chunks.push(strBytes('MThd'),u32(6),u16(1),u16(score.tracks.length+1),u16(PPQ));
  chunks.push(makeMetaTrack(score));
  const channels=availableChannels(score.tracks.length);
  score.tracks.forEach((t,i)=>chunks.push(makeNoteTrack(score,t,channels[i],defaultVelocityForProgram(t.program))));
  return concatBytes(chunks);
}

function availableChannels(n) {
  const out=[];
  for(let ch=0;ch<16 && out.length<n;ch++) if(ch!==9) out.push(ch);
  if(n>out.length) throw new Error('Mehr als 15 melodische MIDI-Spuren werden in diesem Labor nicht unterstuetzt.');
  return out;
}

function defaultVelocityForProgram(program) {
  if(program<=7) return 78;       // piano
  if(program>=24 && program<=31) return 72; // guitar
  if(program>=32 && program<=39) return 76; // bass
  if(program>=40 && program<=51) return 78; // strings
  if(program>=72 && program<=79) return 82; // winds
  return 78;
}

function makeMetaTrack(score) {
  const ev=[];
  ev.push({tick:0,order:0,bytes:metaText(0x03,score.title)});
  const mpqn=Math.round(60000000/score.tempo);
  ev.push({tick:0,order:0,bytes:[0xFF,0x51,0x03,(mpqn>>16)&255,(mpqn>>8)&255,mpqn&255]});
  const denPow=Math.round(Math.log2(score.meterDen));
  ev.push({tick:0,order:0,bytes:[0xFF,0x58,0x04,score.meterNum&255,denPow&255,24,8]});
  if(score.key) ev.push({tick:0,order:0,bytes:metaText(0x01,'KEY: '+score.key)});
  return trackChunk(eventsToTrack(ev));
}

function makeNoteTrack(score,track,channel,defaultVel) {
  if(!track.bars.length) throw new Error(`Spur [${track.name}] ist leer.`);
  const ev=[];
  ev.push({tick:0,order:0,bytes:metaText(0x03,track.name)});
  ev.push({tick:0,order:1,bytes:[0xC0|channel,track.program]});
  const beatsPerBar=score.meterNum*(4/score.meterDen);
  for(const bar of track.bars) {
    let beat=0;
    const barStart=(bar.bar-1)*beatsPerBar;
    for(const token of bar.tokens) {
      const startTick=Math.round((barStart+beat)*PPQ);
      if(token.type==='pedal') {
        ev.push({tick:startTick,order:2,bytes:[0xB0|channel,64,token.value]});
        continue;
      }
      const endTick=Math.round((barStart+beat+token.dur)*PPQ);
      if(!token.rest) {
        for(const p of token.pitches) {
          const note=noteNumber(p), vel=token.vel??defaultVel;
          ev.push({tick:startTick,order:3,bytes:[0x90|channel,note,vel]});
          ev.push({tick:endTick,order:1,bytes:[0x80|channel,note,0]});
        }
      }
      beat+=token.dur;
    }
  }
  const scoreEndTick=Math.round(score.bars*beatsPerBar*PPQ);
  ev.push({tick:scoreEndTick,order:4,bytes:[0xB0|channel,64,0]});
  return trackChunk(eventsToTrack(ev));
}

function noteNumber(name) {
  const m=name.match(/^([A-Ga-g])([#b]?)(-?\d+)$/);
  if(!m) throw new Error(`Ungueltige Tonhoehe: ${name}`);
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];
  const accidental=m[2]==='#'?1:m[2]==='b'?-1:0;
  const octave=+m[3];
  const n=(octave+1)*12+base+accidental;
  if(n<0||n>127) throw new Error(`Ton ausserhalb MIDI-Bereich: ${name}`);
  return n;
}

function eventsToTrack(events) {
  events.sort((a,b)=>a.tick-b.tick||a.order-b.order);
  const out=[]; let prev=0;
  for(const e of events) { out.push(...varLen(e.tick-prev),...e.bytes); prev=e.tick; }
  out.push(0x00,0xFF,0x2F,0x00);
  return out;
}
function trackChunk(bytes){ return concatBytes([strBytes('MTrk'),u32(bytes.length),bytes]); }
function metaText(type,text){ const b=Array.from(new TextEncoder().encode(text)); return [0xFF,type,...varLen(b.length),...b]; }
function varLen(v){ v=Math.max(0,Math.floor(v)); let buffer=v&0x7F; const out=[]; while((v>>=7)){buffer<<=8;buffer|=((v&0x7F)|0x80);} while(true){out.push(buffer&0xFF);if(buffer&0x80)buffer>>=8;else break;} return out; }
function u16(n){return[(n>>8)&255,n&255];}
function u32(n){return[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];}
function strBytes(s){return Array.from(s).map(c=>c.charCodeAt(0));}
function concatBytes(parts){const arrays=parts.map(p=>p instanceof Uint8Array?p:Uint8Array.from(p));const len=arrays.reduce((n,a)=>n+a.length,0);const out=new Uint8Array(len);let pos=0;for(const a of arrays){out.set(a,pos);pos+=a.length;}return out;}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function trimNum(n){return Number(n.toFixed(4)).toString();}
function safeName(s){return(s||'composition').replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,80)||'composition';}
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}
</script>
</body>
</html>
