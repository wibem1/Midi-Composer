<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini 3.7 Flash – MIDI Lab v4</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui,-apple-system,sans-serif; max-width:1000px; margin:28px auto; padding:0 18px; line-height:1.4; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { opacity:.76; margin-top:0; }
  label { display:block; font-weight:650; margin:16px 0 6px; }
  input,textarea,button { font:inherit; }
  input,textarea { width:100%; box-sizing:border-box; padding:10px; border:1px solid #8888; border-radius:8px; }
  textarea { min-height:110px; resize:vertical; }
  #raw { min-height:360px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  button { padding:10px 15px; border-radius:8px; border:1px solid #8888; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { margin-top:12px; white-space:pre-wrap; padding:10px; border-radius:8px; background:#8881; }
  details { margin-top:16px; }
  pre { white-space:pre-wrap; font-size:12px; padding:10px; border-radius:8px; background:#8881; overflow:auto; }
  .keyrow { margin-top:6px; font-size:13px; }
  .checklabel { font-weight:normal; display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .checklabel input { width:auto; }
</style>
</head>
<body>
<h1>Gemini 3.7 Flash – MIDI Lab v4</h1>
<p class="sub">Freie Besetzung und musikalischer Ausdruck: Der Benutzerauftrag bestimmt die Komposition. Gemini kann Velocity und – wo musikalisch sinnvoll – Sustain-Pedal mitkomponieren. Das HTML übersetzt nur die fertige Notenschrift in MIDI.</p>

<label for="key">Gemini API-Key</label>
<input id="key" type="password" autocomplete="off" placeholder="AIza…">
<div class="keyrow">
  <label class="checklabel">
    <input type="checkbox" id="saveKey" checked> API-Key auf diesem Gerät speichern
  </label>
</div>

<label for="prompt">Kompositionsauftrag</label>
<textarea id="prompt">Komponiere ein 24-taktiges Stück für Klavier solo.</textarea>

<div class="row">
  <button id="compose">Mit Gemini 3.7 Flash komponieren</button>
  <button id="midi" disabled>MIDI herunterladen</button>
  <button id="fromRaw">Rohantwort → MIDI</button>
  <button id="rawDownload" disabled>Rohantwort herunterladen</button>
</div>

<div id="status">Bereit.</div>

<label for="raw">Rohe Modellantwort</label>
<textarea id="raw" spellcheck="false" placeholder="Hier erscheint die unveränderte Antwort von Gemini."></textarea>

<details>
  <summary>Technischer Ausgabeauftrag</summary>
  <pre id="contract"></pre>
</details>

<script>
'use strict';

const MODEL = 'gemini-3.7-flash';
const PPQ = 480;
const KEY_STORAGE_ID = 'gemini_midi_lab_api_key';
let currentMidi = null;
let currentTitle = 'composition';

const technicalContract = `
TECHNISCHE AUSGABEANFORDERUNG – keine musikalischen Zusatzregeln:

Erfülle den Benutzerauftrag musikalisch genau so, wie er gestellt wurde. Insbesondere:
- Verwende genau die gewünschte Besetzung. Ersetze oder ergänze keine Instrumente eigenmächtig.
- Halte eine verlangte Taktzahl exakt ein.
- Halte ausdrücklich verlangte Stil-, Taktart-, Tempo-, Tonart- oder Formangaben ein.
- Was der Benutzer NICHT festgelegt hat, entscheidest du musikalisch selbst.

Gib die fertige Komposition ausschließlich in dieser einfachen Notenschrift aus:

TITLE: frei gewählter Titel
BARS: Zahl der Takte der Komposition
TEMPO: ganze Zahl in BPM
METER: Zaehler/Nenner, z.B. 4/4, 3/4 oder 3/2
KEY: freie Textangabe

Danach folgen genau die Instrumente/Stimmen, die der Benutzer verlangt hat. Jede Spur hat einen frei lesbaren Namen und eine General-MIDI-Programmnummer (0 bis 127):

[Piano|GM=0]
1 | D4:1 F4:1 A4:2
2 | [D3,A3]:2 [F3,C4]:2
...

oder bei einem Ensemble zum Beispiel:

[Flute|GM=73]
1 | D5:1 E5:1 F5:1 G5:1
...
[Violin|GM=40]
1 | ...
...

Regeln des DATEIFORMATS, nicht der Komposition:
- Die Zahl der Spurabschnitte ist frei und folgt ausschließlich der vom Benutzer gewünschten Besetzung.
- Bei Solo-Instrument ist genau eine Instrumentenspur auszugeben.
- Spurkopf exakt: [Name|GM=n], wobei n eine General-MIDI-Programmnummer von 0 bis 127 ist.
- Jede Spur enthaelt jeden Takt von 1 bis BARS genau einmal.
- Ein Token ist TONHOEHE:DAUER oder R:DAUER fuer Pause.
- Akkorde stehen in eckigen Klammern: [D3,A3,D4]:2
- Tonhoehen: C, C#, Db, D ... mit Oktavzahl, z.B. F#4 oder Bb3.
- DAUER wird in Viertelnoten-Schlaegen angegeben: 4 = vier Viertel, 2 = zwei Viertel, 1 = ein Viertel, 0.5 = Achtel, 0.25 = Sechzehntel. Dezimalwerte sind erlaubt.
- Gestalte den musikalischen Ausdruck durch sinnvoll differenzierte Anschlagstaerken (Velocity). Schreibe sie als @Wert hinter die Dauer, z.B. D5:1@78 oder [D3,A3,D4]:2@70. Bereich 1–127. Vermeide eine durchgehend identische Velocity, sofern das musikalisch nicht bewusst beabsichtigt ist.
- Wo ein Sustain-Pedal zum verlangten Instrument und zur Musik passt (insbesondere Klavier), darfst und sollst du es musikalisch sinnvoll einsetzen. Verwende dafuer die eigenstaendigen Tokens PEDAL_ON und PEDAL_OFF an der jeweiligen zeitlichen Position im Takt. Diese Tokens haben keine Dauer.
- Beispiel: 1 | PEDAL_ON A2:1@58 [E3,A3,C4]:2@68 PEDAL_OFF E4:1@74
- Bei Instrumenten, fuer die ein Sustain-Pedal musikalisch keinen Sinn ergibt, verwende keine PEDAL-Tokens.
- Die Summe der Dauern jedes Taktes muss zur gewaehlten Taktart passen. Bei 4/4 also 4 Viertelschlaege, bei 3/4 also 3, bei 3/2 also 6.
- Keine Markdown-Codezaeune und kein erklaerender Text vor oder nach der Notenschrift.
`;

document.getElementById('contract').textContent = technicalContract.trim();
const $ = id => document.getElementById(id);
const status = msg => $('status').textContent = msg;

// --- Key Persistence ---
try {
  const saved = localStorage.getItem(KEY_STORAGE_ID);
  if (saved) $('key').value = saved;
} catch(_) {}

$('key').addEventListener('input', () => {
  if ($('saveKey').checked) {
    try { localStorage.setItem(KEY_STORAGE_ID, $('key').value.trim()); } catch(_) {}
  }
});

$('saveKey').addEventListener('change', () => {
  if ($('saveKey').checked) {
    try { localStorage.setItem(KEY_STORAGE_ID, $('key').value.trim()); } catch(_) {}
  } else {
    try { localStorage.removeItem(KEY_STORAGE_ID); } catch(_) {}
  }
});
// -----------------------

$('compose').addEventListener('click', compose);
$('fromRaw').addEventListener('click', () => {
  try {
    const text = $('raw').value.trim();
    if (!text) throw new Error('Keine Rohantwort vorhanden.');
    const score = parseScore(text);
    currentTitle = score.title || 'composition';
    currentMidi = buildMidi(score);
    $('midi').disabled = false;
    $('rawDownload').disabled = false;
    status('Rohantwort erfolgreich in MIDI umgewandelt.\n' + validateScore(score).join('\n'));
  } catch (err) {
    console.error(err);
    status('Fehler beim Umwandeln der Rohantwort: ' + err.message);
  }
});
$('midi').addEventListener('click', () => {
  if (!currentMidi) return;
  downloadBlob(new Blob([currentMidi], {type:'audio/midi'}), safeName(currentTitle) + '.mid');
});
$('rawDownload').addEventListener('click', () => {
  downloadBlob(new Blob([$('raw').value], {type:'text/plain;charset=utf-8'}), safeName(currentTitle) + '_raw.txt');
});

async function compose() {
  const apiKey = $('key').value.trim();
  const userPrompt = $('prompt').value.trim();
  if (!apiKey) { status('Bitte API-Key eingeben.'); return; }
  if (!userPrompt) { status('Bitte Kompositionsauftrag eingeben.'); return; }

  $('compose').disabled = true;
  $('midi').disabled = true;
  $('rawDownload').disabled = true;
  currentMidi = null;
  status('Gemini komponiert …');

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
    const body = {
      contents: [{ role:'user', parts:[{text:userPrompt},{text:technicalContract}] }],
      generationConfig: { maxOutputTokens:32768, thinkingConfig:{thinkingLevel:'medium'} }
    };
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},
      body:JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
    const text = (data.candidates || []).flatMap(c => c.content?.parts || []).map(p => p.text || '').join('').trim();
    if (!text) throw new Error('Gemini lieferte keinen Text.');
    $('raw').value = text;
    $('rawDownload').disabled = false;

    const score = parseScore(text);
    currentTitle = score.title || 'composition';
    currentMidi = buildMidi(score);
    $('midi').disabled = false;
    status('Komposition empfangen und MIDI erzeugt.\n' + validateScore(score).join('\n'));
  } catch (err) {
    console.error(err);
    status('Fehler: ' + err.message + '\n\nDie Rohantwort bleibt sichtbar, falls bereits eine angekommen ist.');
  } finally {
    $('compose').disabled = false;
  }
}
